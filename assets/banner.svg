<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="glow-purple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-pink" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Animated Filter for Floating Effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.5deg); }
    }
    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-0.5deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes beacon {
      0% { r: 4px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }
    @keyframes node-pulse {
      0%, 100% { filter: drop-shadow(0 0 2px #38bdf8); }
      50% { filter: drop-shadow(0 0 10px #818cf8); }
    }

    .bg-pulse-1 { animation: pulse 8s ease-in-out infinite; transform-origin: 20% 30%; }
    .bg-pulse-2 { animation: pulse 10s ease-in-out infinite 2s; transform-origin: 80% 40%; }
    .float-card-1 { animation: float-slow 6s ease-in-out infinite; }
    .float-card-2 { animation: float-reverse 7s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 6; animation: dash 20s linear infinite; }
    .signal-ping { animation: beacon 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .interactive-node { animation: node-pulse 3s ease-in-out infinite; }
  </style>

  <!-- Deep Canvas -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <rect width="1200" height="360" fill="url(#glow-purple)" class="bg-pulse-1" />
  <rect width="1200" height="360" fill="url(#glow-cyan)" class="bg-pulse-2" />
  <rect width="1200" height="360" fill="url(#glow-pink)" />

  <!-- Subtle Digital Network / Matrix Grid in Background -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="0.8" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#38bdf8" stroke-width="0.8" />
  </g>

  <!-- Dynamic Connecting Synapse Paths (Network Flow in lower plane) -->
  <g opacity="0.4">
    <path class="flow-line" d="M 120,290 C 260,250 420,320 600,280 C 780,240 940,310 1080,270" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flow-line" d="M 150,100 C 320,130 450,70 650,110 C 850,150 980,80 1100,120" fill="none" stroke="#06b6d4" stroke-width="1.8" />
  </g>

  <!-- Ambient Dynamic Floating Decorative Cards (Placed at margins, completely clear of central text) -->
  <g class="float-card-1" opacity="0.85">
    <rect x="50" y="45" width="180" height="64" rx="14" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#shadow)" />
    <circle cx="76" cy="77" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <text x="76" y="82" font-size="14" text-anchor="middle" fill="#38bdf8">🤖</text>
    <text x="100" y="72" font-size="12" font-weight="700" fill="#f8fafc">AI Social Reach</text>
    <text x="100" y="88" font-size="10" fill="#94a3b8">Autonomous Agents</text>
    <circle cx="205" cy="58" r="4" fill="#10b981" />
  </g>

  <g class="float-card-2" opacity="0.85">
    <rect x="970" y="45" width="180" height="64" rx="14" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#shadow)" />
    <circle cx="996" cy="77" r="14" fill="#ec4899" fill-opacity="0.2" />
    <text x="996" y="82" font-size="14" text-anchor="middle" fill="#ec4899">📊</text>
    <text x="1020" y="72" font-size="12" font-weight="700" fill="#f8fafc">Multi-Platform</text>
    <text x="1020" y="88" font-size="10" fill="#94a3b8">Publishing &amp; Listening</text>
    <circle cx="1125" cy="58" r="4" fill="#38bdf8" />
  </g>

  <!-- Glowing Signal Pings -->
  <g transform="translate(180, 290)">
    <circle class="signal-ping" cx="0" cy="0" r="4" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>
  <g transform="translate(1020, 275)">
    <circle class="signal-ping" cx="0" cy="0" r="4" fill="none" stroke="#ec4899" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#ec4899" />
  </g>

  <!-- FOREGROUND LAYER: Pure Unobscured Central Typography & Core Badges -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(470, 48)">
      <rect x="0" y="0" width="260" height="28" rx="14" fill="url(#badge-grad)" fill-opacity="0.22" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4" fill="#10b981" class="interactive-node" />
      <text x="135" y="19" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="130" font-size="44" font-weight="900" text-anchor="middle" fill="url(#title-grad)" letter-spacing="-0.8">
      Awesome Social Media Marketing
    </text>
    <text x="600" y="174" font-size="34" font-weight="800" text-anchor="middle" fill="#f1f5f9" letter-spacing="-0.5">
      &amp; AI Outreach Platforms
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="600" y="215" font-size="15" font-weight="400" text-anchor="middle" fill="#94a3b8" letter-spacing="0.2">
      Top Enterprise SaaS Suites • High-Star Open Source Schedulers • Autonomous AI Marketing Agents
    </text>

    <!-- Quick Stat Feature Pills Across Foreground Bottom -->
    <g transform="translate(240, 252)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="82" y="24" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Multi-Channel Queue</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="170" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="85" y="24" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">🤖 Agentic Outreach</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(375, 0)">
        <rect width="170" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="85" y="24" font-size="12" font-weight="600" fill="#ec4899" text-anchor="middle">📡 Real-Time Listening</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(565, 0)">
        <rect width="155" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="77" y="24" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">🔓 100% Self-Hostable</text>
      </g>
    </g>
  </g>
</svg>
